[package]
name = "rust-instrument"
version = "0.1.0"
edition = "2021"

[dependencies]
wasm-instrument = { path = "vendor/wasm-instrument", version = "=0.4.0", features = ["sign_ext", "bulk"] }
# The Rust module uses sign-extension ops (i32.extend8_s).
parity-wasm = { version = "=0.45.0", default-features = false, features = ["std", "sign_ext", "bulk"] }
wasmparser = "=0.259.0"

[workspace]
exclude = ["vendor/wasm-instrument"]

[dependencies.wat]
version = "=1.262.0"
