[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "@solidity/=lib/crypto-lib/src/",
  "forge-std/=lib/forge-std/src/",
  "gasbench/=src/",
]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
gas_limit = 9223372036854775807

[lint]
lint_on_build = false
